name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:check
      - name: Verify workflow version
        run: |
          node -e "const pkg=require('./package.json'); const ref=process.env.GITHUB_REF_NAME || ''; const input=process.env.INPUT_VERSION || ''; const expected=ref.startsWith('v') ? ref.slice(1) : input; if (expected && pkg.version !== expected) { throw new Error(`package.json ${pkg.version} does not match ${expected}`); }"
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - run: npm publish
