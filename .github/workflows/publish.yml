name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:check
      - name: Verify workflow version
        run: |
          node -e "const pkg=require('./package.json'); const ref=process.env.GITHUB_REF_NAME || ''; const input=process.env.INPUT_VERSION || ''; const expected=ref.startsWith('v') ? ref.slice(1) : input; if (expected && pkg.version !== expected) { throw new Error(`package.json ${pkg.version} does not match ${expected}`); }"
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Ensure GitHub Release exists before npm publish
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "Atlas WiKi v${VERSION}" --notes-file "docs/release/v${VERSION}.md"
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
      - run: npm publish
      - name: Post-publish smoke
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          ATLAS_WIKI_PUBLISHED_SPEC=atlas-wiki@${VERSION} npm run release:published-check
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
      - name: Generate postpublish evidence
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          ATLAS_WIKI_PUBLISHED_SPEC=atlas-wiki@${VERSION} node scripts/generate-next-stable-release-evidence.mjs --postpublish --smoke-ok
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
      - uses: actions/upload-artifact@v6
        with:
          name: atlas-wiki-postpublish-evidence
          path: release-evidence/postpublish-v*.json
          if-no-files-found: error
      - name: Upload postpublish evidence to GitHub Release
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          gh release upload "v${VERSION}" "release-evidence/postpublish-v${VERSION}.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
